name: Coventry Building Society
kind: company
description: >-
  Coventry Building Society is the United Kingdom's second-largest building
  society, a member-owned mutual founded in 1884 and headquartered in Coventry,
  England, offering savings and residential mortgages to millions of members and
  in January 2025 completing its acquisition of The Co-operative Bank. As an
  FCA-authorised and PRA-regulated deposit-taker and Account Servicing Payment
  Service Provider (ASPSP), it participates in UK Open Banking under PSD2 and the
  Open Banking Implementation Entity (OBIE) standards. It is not one of the CMA9
  mandated banks, but operates a public developer portal at
  developer.coventrybuildingsociety.co.uk that publishes CBS v2.0 Open Banking
  APIs - Account Information Services (AIS), Payment Initiation Services (PIS),
  and Confirmation of Funds (CBPII) - conformant to the OBIE Read/Write API
  Standard, alongside a public FCA Service Metrics open-data endpoint and a
  sandbox for TPP onboarding. Read/Write access is secured with FAPI-grade
  OAuth2/OIDC, PSD2 strong customer authentication, and mutual-TLS using Open
  Banking WAC or eIDAS QWAC certificates, with registered TPP onboarding handled
  via open.banking@thecoventry.co.uk.
